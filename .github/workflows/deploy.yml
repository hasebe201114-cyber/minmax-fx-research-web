name: Deploy MkDocs site to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

# mkdocs gh-deploy で gh-pages ブランチへ直接 push するため contents: write が必要
# (actions/deploy-pages@v4 と異なり github-pages environment 保護ルールの対象外)
permissions:
  contents: write

# 同時デプロイの防止 (古いビルドのデプロイ回避)
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build and Deploy to gh-pages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history for mkdocs gh-deploy)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt

      - name: Install runtime dependencies (mkdocs)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install build-time dependencies (matplotlib, for chart generation)
        run: pip install -r requirements-build.txt

      - name: Sync artifacts from lab PJ (best-effort)
        # ラボ PJ (minmax-fx-day-trading-lab) は別リポのため CI では取得不可。
        # ローカルで sync 済みの docs/backtest-results/ docs/papers/ をそのまま使う。
        run: |
          echo "Skipping lab sync in CI (lab PJ is a separate repo)."
          echo "Run scripts/sync_from_lab.py locally before pushing if you need fresh lab data."

      - name: Generate charts (balance / drawdown)
        # ラボ PJ からの trades-*.json が必要。
        # ラボ PJ の outputs を本PJに同梱するか、上記の sync を行うこと。
        run: |
          if ls research/EXP-FX000001/10-result/trades-*.json 1> /dev/null 2>&1; then
            python scripts/generate_charts.py
          else
            echo "WARN: trades-*.json が見つかりません。チャート生成をスキップします。"
            echo "(ローカルでラボ PJ から取り込み後に再 push してください)"
          fi

      - name: Build and deploy to gh-pages
        # mkdocs gh-deploy が build (--strict 込み) → gh-pages ブランチへの push まで一気通貫
        # 環境保護ルールに引っかからない (environment 指定なし、gh-pages ブランチは GitHub 自動 Pages deploy が処理)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdocs gh-deploy --force --strict --clean
